    <main>
        <div class="atendimento-container">
    <div class="page-header">
      <h1>Registro de Atendimento</h1>
      <p>Registre os serviços realizados</p>
    </div>
    <div class="conteudo">
        <h4>Novo Registro</h4>
        <p>Preencha o formulário abaixo para criar um novo chamado de atendimento.</p>
        
        <form id="atendimento-form">
            <div class="form-group">
                <label for="titulo">Data do Chamado:</label>
                <input type="date" id="titulo" name="titulo" required>
            

            
                <label for="horas">Horas Trabalhadas:</label>
                <input type="time" id="horas" name="horas" required>
            </div>

            <div class="form-group">
                <label for="prioridade">Contrato:</label>
                <select id="prioridade" name="prioridade" required>
                    <option value="">Selecione o contrato</option>
                    <option value="baixa">Prefeitura Municipal de Santos - C001</option>
                    <option value="media">Câmara Municipal de Guarujá - C002</option>
                </select>
                
                <div class="form-group">
                    <label for="chamado">Chamado (Opcional):</label>
                    <select id="chamado" name="chamado" required>
                        <option value="">Nenhum</option>
                        <option value="T001">T001 - Erro no Sistema de ponto eletrônico</option>
                        <option value="T002">T002 - Solicitção de novo  usuário no sistema</option>
                        <option value="T003">T003 - Relatório mensal de folha de pagamento</option>
                        <option value="T004">T004 - Backup de servidor</option>
                        <option value="T005">T005 - Impressora não funcionando</option>
                    </select>

                    <div class="form-group">
                        <label for="descricao">Descrição do Atendimento:</label>
                        <textarea id="descricao" name="descricao" rows="4" placeholder="Descreva o detalhadamente o serviço prestado" required></textarea>

                        <input type="file" multiple>
            </div>

            <button type="submit" class="submit-btn">Criar Chamado</button>
        </form>

    </div>

    
    <script src="javascript/atendimento.js"></script>
